# Generated by converter L1 (security domain). Sources:
#   lz-account-baseline.yaml, lz-audit-guardduty*.yaml,
#   lz-delegate-security-services.yaml, lz-delegate-firewall-manager-ipam.yaml,
#   lz-audit-access-analyzer.json, lz-organization-kms-iam.json.
# SSM session prefs deferred to global-config (see _deferrals/global.json).
# IPAM delegation deferred to network-config (see _deferrals/network.json).

centralSecurityServices:
  delegatedAdminAccount: Audit
  ebsDefaultVolumeEncryption:
    enable: true
    excludeRegions: []
  s3PublicAccessBlock:
    enable: true
    excludeAccounts: []
  scpRevertChangesConfig:
    enable: true
  snsSubscriptions: []
  guardduty:
    enable: true
    excludeRegions: []
    s3Protection:
      enable: true
      excludeRegions: []
    eksProtection:
      enable: true
      excludeRegions: []
    ec2Protection:
      enable: true
      keepSnapshots: false
      excludeRegions: []
    rdsProtection:
      enable: true
      excludeRegions: []
    lambdaProtection:
      enable: true
      excludeRegions: []
    exportConfiguration:
      enable: true
      overrideExisting: false
      destinationType: S3
      exportFrequency: FIFTEEN_MINUTES
  securityHub:
    enable: false
    excludeRegions: []
    standards: []
  ssmAutomation:
    excludeRegions: []
    documentSets: []
accessAnalyzer:
  enable: true
iamPasswordPolicy:
  minimumPasswordLength: 14
  requireSymbols: true
  requireNumbers: true
  requireUppercaseCharacters: true
  requireLowercaseCharacters: true
  maxPasswordAge: 90
  passwordReusePrevention: 24
  allowUsersToChangePassword: true
  hardExpiry: false
awsConfig:
  enableConfigurationRecorder: false
  ruleSets: []
cloudWatch:
  metricSets: []
  alarmSets: []
keyManagementService:
  keySets:
  - name: THSLZ-cloudwatch-logs-key
    alias: cloudwatch-logs-key
    description: KMS key for CloudWatch Logs encryption
    policy: kms-policies/cloudwatch-logs-key.json
    deploymentTargets:
      organizationalUnits:
      - Root
  - name: THSLZ-control-tower-backup-key
    alias: control-tower-backup-key
    description: KMS key for Control Tower Backup encryption
    policy: kms-policies/control-tower-backup-key.json
    deploymentTargets:
      organizationalUnits:
      - Root
