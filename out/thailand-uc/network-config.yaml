# Generated by converter L1 (network domain) — PARTIAL EXTRACTION.
# High-level structure only. Route tables, NACL entries, subnet
# route-table associations, NAT/IGW wiring, TGW static routes and
# attachment→routeTable pinning were NOT mechanically translated —
# SLZ CFN resource-level semantics do not map 1:1 onto LZA schema.
# Hand-port + verify against sources during task #9 review:
#   - lz-central-network.json (routing, NACLs, NFW subnet placement)
#   - lz-account-vpc-template.yaml (spoke subnet routing + NACLs)
# Suricata rules file copied verbatim to firewall-rules/suricata-rules.txt.

defaultVpc:
  delete: true
  excludeAccounts: []
endpointPolicies:
- name: OpenAccess
  document: vpc-endpoint-policies/open-access.json
transitGateways:
- name: THSLZ-ap-southeast-7-tgw
