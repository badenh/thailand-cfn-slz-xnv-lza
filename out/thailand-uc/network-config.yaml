centralNetworkServices:
  delegatedAdminAccount: Network
  networkFirewall:
    firewalls:
    - name: THSLZ-ap-southeast-7-firewall
      firewallPolicy: THSLZ-strict-fw-policy
      vpc: THSLZ-NetworkInspection
      subnets:
      - NetworkInspectionTgwAttachA
      - NetworkInspectionTgwAttachB
      - NetworkInspectionTgwAttachC
    policies:
    - name: THSLZ-strict-fw-policy
      regions:
      - ap-southeast-7
      firewallPolicy:
        statelessDefaultActions:
        - aws:forward_to_sfe
        statelessFragmentDefaultActions:
        - aws:forward_to_sfe
        statefulRuleGroups:
        - name: THSLZ-suricata-rules
      shareTargets:
        organizationalUnits:
        - Infrastructure
        - Workloads
        - Workloads/Production
        - Workloads/NonProduction
    rules:
    - name: THSLZ-suricata-rules
      regions:
      - ap-southeast-7
      capacity: 1000
      type: STATEFUL
      ruleGroup:
        rulesSource:
          rulesFile: firewall-rules/suricata-rules.txt
      shareTargets:
        organizationalUnits:
        - Infrastructure
        - Workloads
        - Workloads/Production
        - Workloads/NonProduction
vpcFlowLogs:
  trafficType: ALL
  maxAggregationInterval: 600
  destinations:
  - s3
  - cloud-watch-logs
  defaultFormat: true
  customFields: []
