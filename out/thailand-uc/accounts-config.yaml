# Generated by converter. Mandatory accounts follow LZA convention;
# workload accounts inferred from SLZ readme (SharedServices, CentralBackup,
# Network — see readme Installation Steps 4, 5, 6). Emails are Jinja tokens
# resolved via replacements-config.yaml; reviewer must populate real
# distribution-list addresses (SLZ readme step 8 requires unique emails).

mandatoryAccounts:
- name: Management
  description: AWS Organizations management account (existing)
  email: '{{ ManagementEmail }}'
  organizationalUnit: Root
- name: LogArchive
  description: Control Tower log archive account
  email: '{{ LogArchiveEmail }}'
  organizationalUnit: Security
- name: Audit
  description: Control Tower audit / security aggregator account
  email: '{{ AuditEmail }}'
  organizationalUnit: Security
workloadAccounts:
- name: SharedServices
  description: Backup admin, IdC delegation, shared operations (TH readme step 4)
  email: '{{ SharedServicesEmail }}'
  organizationalUnit: Infrastructure
- name: CentralBackup
  description: Central AWS Backup vault
  email: '{{ CentralBackupEmail }}'
  organizationalUnit: Infrastructure
- name: Network
  description: Hub network account — TGW, NFW, VPC endpoints (lz-central-network.json)
  email: '{{ NetworkEmail }}'
  organizationalUnit: Infrastructure
